[project]
name = "sqlstepper"
version = "0.1.0"
description = "逐步視覺化 SQL 執行過程的學習工具（DuckDB + sqlglot）"
readme = "README.md"
authors = [
    { name = "webb.hong", email = "wh50509@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "duckdb>=1.5.5",
    "sqlglot>=30.20.0",
]

[project.scripts]
sqlstepper = "sqlstepper.__main__:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pandas>=3.0.6",
    "playwright>=1.63.0",
    "pyarrow>=25.0.1",
    "pytest>=9.1.1",
]

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
